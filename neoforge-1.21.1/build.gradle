plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = '1.0.0'
group = 'local.arachnidguard'
base { archivesName = 'arachnidguard-neoforge-1.21.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
neoForge {
    version = '21.1.250'
    addModdingDependenciesTo(sourceSets.gametest)
    runs {
        server { server(); programArgument '--nogui' }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = file(project.findProperty('testDir') ?: 'run')
            sourceSet = sourceSets.gametest
            systemProperty 'neoforge.enabledGameTestNamespaces', 'arachnidguard'
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
            jvmArgument '-Xmx6G'
        }
    }
    mods {
        arachnidguard { sourceSet sourceSets.main; sourceSet sourceSets.gametest }
    }
}
if (project.hasProperty('compatMods')) {
    dependencies { runtimeOnly fileTree(project.property('compatMods')).matching { include '*.jar' } }
    neoForge.runs.gameTestServer.systemProperty 'arachnidguard.compat', 'true'
}
if (project.hasProperty('optMods')) {
    dependencies { runtimeOnly fileTree(project.property('optMods')).matching { include '*.jar' } }
    neoForge.runs.gameTestServer.systemProperty 'arachnidguard.restartProbe', 'true'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('jar', Jar) { from('LICENSE'); manifest { attributes 'Implementation-Version': project.version } }
